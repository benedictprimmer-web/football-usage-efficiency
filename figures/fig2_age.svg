  <g id="text_15">
   <text style="font-size: 10px; font-family: 'Helvetica Neue', 'Arial', 'DejaVu Sans'; fill: #767671" transform="translate(18 81.390781)">Flop rate (output per 90 down by more than 25%) after a club</text>

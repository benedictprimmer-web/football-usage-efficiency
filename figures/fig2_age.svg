  </g>
  <g id="text_17">
   <text style="font-size: 10px; font-family: 'Helvetica Neue', 'Arial', 'DejaVu Sans'; fill: #3d3d3a" transform="translate(18 356.480625)">At 26–28 the gap is +9 points (95% interval +1 to +17). It is</text>

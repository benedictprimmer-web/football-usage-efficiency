  </g>
  <g id="text_21">
   <text style="font-size: 10px; font-family: 'Helvetica Neue', 'Arial', 'DejaVu Sans'; fill: #1d1d1b" transform="translate(18 326.300781)">Fee paid: +1.8 points (−3.8 to 7.4). Most moves with no fee</text>
   <text style="font-size: 10px; font-family: 'Helvetica Neue', 'Arial', 'DejaVu Sans'; fill: #1d1d1b" transform="translate(18 340.758594)">on record belong to players with no Transfermarkt transfer</text>
   <text style="font-size: 10px; font-family: 'Helvetica Neue', 'Arial', 'DejaVu Sans'; fill: #1d1d1b" transform="translate(18 355.33125)">history at all. That may reflect a later career outside the</text>
   <text style="font-size: 10px; font-family: 'Helvetica Neue', 'Arial', 'DejaVu Sans'; fill: #1d1d1b" transform="translate(18 369.84375)">data, so that bar may use hindsight.</text>

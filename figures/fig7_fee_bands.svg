  <g id="text_19">
   <text style="font-size: 10px; font-family: 'Helvetica Neue', 'Arial', 'DejaVu Sans'; fill: #767671" transform="translate(18 81.39625)">Flop or lost place the next season, movers in each fee band</text>
   <text style="font-size: 10px; font-family: 'Helvetica Neue', 'Arial', 'DejaVu Sans'; fill: #767671" transform="translate(18 95.868906)">minus all stayers, matched on last season. Movers in</text>
